[package]
name = "cache-bench"
description = "The cache-bench command line tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[[bin]]
name = "cache-bench"
path = "src/main.rs"

[dependencies]
cb-cache.workspace = true
cb-chart.workspace = true
cb-core.workspace = true
cb-docs.workspace = true
cb-mem.workspace = true
cb-memtier.workspace = true
cb-perf.workspace = true
cb-stats.workspace = true
clap = { version = "4.6.6", features = ["derive"] }
# The rust backend rather than the default, because the workspace denies unsafe code and a zlib linked from C is a build dependency on whatever the measuring host happens to have.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = { version = "0.4.44", default-features = false }

[lints]
workspace = true
