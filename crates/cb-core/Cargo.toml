[package]
name = "cb-core"
description = "Types, the on disk JSON model, config and hardware profiles for cache-bench."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
jsonc-parser = { version = "0.33.1", default-features = false, features = ["serde"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
thiserror = "2.0.20"
toml = { version = "1.1.5", default-features = false, features = ["parse", "serde"] }
