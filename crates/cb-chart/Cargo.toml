[package]
name = "cb-chart"
description = "The chart engine for cache-bench, axes and layout and its own rasterizer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cb-core.workspace = true
png = "0.18.1"
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
# float_roundtrip because the golden fixtures are full of numbers that have to come back as the exact bits Python wrote.
# Without it serde_json parses with a fast path that is allowed to be a unit in the last place out, and a gridline one bit out is a test that fails for a reason nobody would ever guess.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
# The font parser, which reads the embedded faces and hands back glyph outlines.
# ab_glyph is the obvious choice and it is not the one made here: it sits on ttf-parser, which its author has marked unmaintained, and cargo-deny fails the build on that.
# skrifa is what the advisory points at instead.
skrifa = "0.46.2"
thiserror = "2.0.20"
zeno = "0.3.3"

[dev-dependencies]
sha2 = "0.11.0"
