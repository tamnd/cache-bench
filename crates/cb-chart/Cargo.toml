[package]
name = "cb-chart"
description = "The chart engine for cache-bench, built on plotters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cb-core.workspace = true
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
# The font parser, used here to prove the three embedded faces are what they claim to be.
# ab_glyph is the obvious choice because plotters draws text with it, and it is not the choice made here: it sits on ttf-parser, which its author has marked unmaintained, and cargo-deny fails the build on that.
# skrifa is what the advisory points at and it is a hard dependency of nothing else, so the renderer can be settled on its own terms rather than by what a font crate dragged in.
skrifa = "0.46.2"

[dev-dependencies]
serde_json = "1.0.151"
sha2 = "0.11.0"
