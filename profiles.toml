# Hardware profiles.
#
# The original hardcodes a 32 core box: the cache pinned to cores 0 to 15, the load generator pinned to 16 to 31, 32 GB of cache memory, and a thread sweep that runs to 16.
# None of that is written down anywhere as data, so running it on a different machine means editing the driver script and the Go source.
#
# Here it is data, every result file records which profile produced it, and every chart is stamped with the host it came from.
# Mixing two profiles into one chart set without saying so is the mistake this file exists to prevent.

[profiles.reference]
description = "The original's box. AWS c8g.8xlarge, 32 core ARM64, non NUMA."
cores = 32
cache_pin = "0-15"
bench_pin = "16-31"
threads = [1, 2, 3, 4, 5, 6, 7, 8, 10, 12, 14, 16]
bench_threads = 16
connections_per_thread = 16
operations = 100000
size_range = "1-1024"
# The original leaves this at memtier's default of ten million and never says so.
# At an average value of 512 bytes that is about six gigabytes live, which is why maxmemory is 32 GB: it is chosen so that nothing is ever evicted.
# Shrink one without the other and the benchmark quietly becomes an eviction benchmark, which is the easiest way to get confidently wrong numbers here.
key_maximum = 10000000
maxmemory = "32gb"
pipelines = [1, 10, 25, 50]
runs = 31
perf = ["no", "yes"]

[profiles.wsl32]
description = "32 core x86_64, WSL2. Matches the reference topology. No PMU."
cores = 32
cache_pin = "0-15"
bench_pin = "16-31"
threads = [1, 2, 3, 4, 5, 6, 7, 8, 10, 12, 14, 16]
bench_threads = 16
connections_per_thread = 16
operations = 100000
size_range = "1-1024"
key_maximum = 10000000
maxmemory = "32gb"
pipelines = [1, 10, 25, 50]
runs = 31
# Hyper-V does not give the guest a virtual PMU, so there is no cycles counter to read and the eight CPU cycles charts cannot come from this host.
# Running the perf half of the matrix here would produce ten thousand result files whose only effect is to be filtered back out by the chart layer.
perf = ["no"]

[profiles.wsl32coarse]
description = "The wsl32 box and the wsl32 working set, sampled coarsely so a number exists before the full matrix finishes."
# A run of this matrix is a ninety second warmup and two passes of twenty-five million operations, so a cell is minutes and the full wsl32 sweep is weeks.
# That is the right shape for a published curve and the wrong shape for finding out where an engine stands, and waiting weeks for the first throughput number is how a project ends up publishing no throughput number at all.
#
# What this profile gives up is resolution and confidence, and nothing else.
# The topology, the working set, the key maximum, the memory ceiling and the four pipeline depths are wsl32's exactly, so a cell here measures the same thing a cell there measures and the two can be compared cell for cell.
# What it does not give is the twelve point thread curve or the thirty-one run spread, so a number from here is a position rather than a plot, and a difference of a few per cent between two engines is inside what five runs can tell apart.
cores = 32
cache_pin = "0-15"
bench_pin = "16-31"
# One thread, half the cache's cores, and all of them. Enough to say whether an engine scales, not enough to say how it scales.
threads = [1, 8, 16]
bench_threads = 16
connections_per_thread = 16
operations = 100000
size_range = "1-1024"
key_maximum = 10000000
maxmemory = "32gb"
pipelines = [1, 10, 25, 50]
# Five rather than thirty-one. The trim is ten per cent and nothing below eleven runs, so all five of these are selected from and none is thrown away.
runs = 5
perf = ["no"]

[profiles.epyc8]
description = "8 core x86_64. A quarter of the reference, scaled coherently. Real PMU."
cores = 8
cache_pin = "0-3"
bench_pin = "4-7"
threads = [1, 2, 3, 4]
bench_threads = 4
connections_per_thread = 16
operations = 100000
size_range = "1-1024"
# Scaled with maxmemory, not left at the default. See the note above.
key_maximum = 2500000
maxmemory = "8gb"
pipelines = [1, 10, 25, 50]
runs = 31
perf = ["no", "yes"]

[profiles.epyc8coarse]
description = "The epyc8 box and the epyc8 working set, sampled coarsely so a number exists before the full matrix finishes."
# What wsl32coarse is to wsl32, this is to epyc8, and for the same reason.
# The full epyc8 matrix is four thread counts, four pipeline depths, thirty-one runs and both halves of the perf flag, which is eight thousand cells and weeks of machine time.
#
# The topology, the working set, the key maximum, the memory ceiling and the four pipeline depths are epyc8's exactly, so a cell here measures the same thing a cell there measures and the two can be compared cell for cell.
# What it gives up is the thread curve, the spread and the cycles counters, so a number from here is a position rather than a plot.
cores = 8
cache_pin = "0-3"
bench_pin = "4-7"
# One thread, half the cache's cores, and all of them, which is the same three points wsl32coarse takes.
threads = [1, 2, 4]
bench_threads = 4
connections_per_thread = 16
operations = 100000
size_range = "1-1024"
key_maximum = 2500000
maxmemory = "8gb"
pipelines = [1, 10, 25, 50]
# Five rather than thirty-one, which is what the trim rule allows without throwing a run away.
runs = 5
# The box has a PMU and the cycles half of the matrix doubles the time, so it is left to the full profile.
# A cycles number wanted for one particular change is better had from perf directly than from a sweep that measures eight engines to answer a question about one.
perf = ["no"]

[profiles.smoke]
description = "A small box, for finding out whether a change helped. Numbers from it are not comparable with anything."
# Four cores, which is server1 and the smallest thing worth iterating on. A six core box runs this profile too and gets the same shape, because the point is that two runs of it are comparable with each other and with nothing else.
cores = 4
cache_pin = "0-1"
bench_pin = "2-3"
# Two points rather than twelve. Enough to see whether a change moved the curve or only moved one point on it.
threads = [1, 2]
bench_threads = 2
connections_per_thread = 16
# A tenth of the reference, because this profile is answering a question in minutes and the answer does not get better for taking an hour.
operations = 10000
size_range = "1-1024"
# Scaled with maxmemory, the same way epyc8 is. A working set that outgrows the limit turns this into an eviction benchmark, and it would do it quietly.
key_maximum = 250000
maxmemory = "1gb"
# Depth one is syscall bound and depth ten is where the batching work is meant to show, so those are the two that answer the question.
pipelines = [1, 10]
runs = 3
perf = ["no"]
# The whole reason this profile exists is to be run on a box that is not fit to publish from. `docs` refuses to write a results README from it.
publishable = false

