[workspace]
resolver = "3"
members = [
    "crates/cache-bench",
    "crates/cb-cache",
    "crates/cb-chart",
    "crates/cb-core",
    "crates/cb-docs",
    "crates/cb-mem",
    "crates/cb-memtier",
    "crates/cb-perf",
    "crates/cb-stats",
    "xtask",
]

[workspace.package]
version = "0.5.1"
edition = "2024"
# Held behind stable, and it matches the floor in tamnd/yo so the two trees agree on what a supported compiler is.
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/tamnd/cache-bench"
authors = ["tamnd <tamnd87@gmail.com>"]
readme = "README.md"
keywords = ["benchmark", "cache", "redis", "valkey", "memcached"]
categories = ["caching", "development-tools::profiling"]
# Everything except xtask goes to crates.io, so that `cargo install cache-bench` is the answer to how to get this on a machine that is going to be measured. The libraries go with it because a binary cannot be published without them, and because the file model and the statistics are worth reading on their own.
publish = true

# A path for building here and a version for building anywhere else. Cargo uses the path in this workspace and rewrites the entry to the version when the crate is packaged, so both have to be here and the version has to move with the workspace version.
[workspace.dependencies]
cb-cache = { path = "crates/cb-cache", version = "0.5.1" }
cb-chart = { path = "crates/cb-chart", version = "0.5.1" }
cb-core = { path = "crates/cb-core", version = "0.5.1" }
cb-docs = { path = "crates/cb-docs", version = "0.5.1" }
cb-mem = { path = "crates/cb-mem", version = "0.5.1" }
cb-memtier = { path = "crates/cb-memtier", version = "0.5.1" }
cb-perf = { path = "crates/cb-perf", version = "0.5.1" }
cb-stats = { path = "crates/cb-stats", version = "0.5.1" }

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
# Deny rather than forbid, because process control has no safe equivalent in the standard library.
# cb-cache needs it to put a child in its own process group and pin it between fork and exec, to signal a whole group, and to ask whether a group is still there.
# Every one of those sites allows the lint on its own with a safety comment saying why it is sound, and there is no unsafe anywhere else.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
panic = "deny"
unwrap_used = "deny"
expect_used = "warn"
float_cmp = "deny"
# Not decoration.
# The chart layer turns f64 measurements into integers in three places and each one has a rounding mode that has to match the original.
# A silent truncation would produce charts that are wrong by one, which is the kind of wrong nobody ever notices.
cast_possible_truncation = "deny"
cast_precision_loss = "warn"
# Duplicate versions are checked by cargo-deny instead, which reports them with the path that pulled each one in.
# This lint fires on a duplicate nothing here can fix: png depends on miniz_oxide directly and on flate2, which depends on a different minor version of the same crate, so the only ways to satisfy the lint are to stop encoding PNGs or to stop treating warnings as errors.
multiple_crate_versions = "allow"

# The harness spends its life waiting on two child processes in sequence, so none of this is about its own speed.
# It is about start time and binary size.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
