[workspace]
resolver = "3"
members = [
    "crates/cb-cache",
    "crates/cb-chart",
    "crates/cb-cli",
    "crates/cb-core",
    "crates/cb-docs",
    "crates/cb-memtier",
    "crates/cb-perf",
    "crates/cb-stats",
    "xtask",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
# Held behind stable, and it matches the floor in tamnd/yo so the two trees agree on what a supported compiler is.
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/tamnd/cache-bench"
authors = ["tamnd <tamnd87@gmail.com>"]
readme = "README.md"
keywords = ["benchmark", "cache", "redis", "valkey", "memcached"]
categories = ["caching", "development-tools::profiling"]
# Nothing here goes to crates.io. This is a harness, not a library, and the only useful artefact is a binary that runs on the box the sweep will happen on.
publish = false

# Paths only, with no version requirement, because none of these is published and none of them will be.
# A version here has to be bumped in lockstep with the workspace version or the build stops resolving, which is a chore that buys nothing when the only consumer of a crate is the binary next to it.
[workspace.dependencies]
cb-cache = { path = "crates/cb-cache" }
cb-chart = { path = "crates/cb-chart" }
cb-core = { path = "crates/cb-core" }
cb-docs = { path = "crates/cb-docs" }
cb-memtier = { path = "crates/cb-memtier" }
cb-perf = { path = "crates/cb-perf" }
cb-stats = { path = "crates/cb-stats" }

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
# Deny rather than forbid, because cb-cache needs one block of it for the pre_exec closure that sets CPU affinity before the server starts.
# That block allows the lint at the site, with a safety comment, and it is the only unsafe in the tree.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
panic = "deny"
unwrap_used = "deny"
expect_used = "warn"
float_cmp = "deny"
# Not decoration.
# The chart layer turns f64 measurements into integers in three places and each one has a rounding mode that has to match the original.
# A silent truncation would produce charts that are wrong by one, which is the kind of wrong nobody ever notices.
cast_possible_truncation = "deny"
cast_precision_loss = "warn"
# Duplicate versions are checked by cargo-deny instead, which reports them with the path that pulled each one in.
# This lint fires on a duplicate nothing here can fix: png depends on miniz_oxide directly and on flate2, which depends on a different minor version of the same crate, so the only ways to satisfy the lint are to stop encoding PNGs or to stop treating warnings as errors.
multiple_crate_versions = "allow"

# The harness spends its life waiting on two child processes in sequence, so none of this is about its own speed.
# It is about start time and binary size.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
