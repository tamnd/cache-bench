[default]
# Every engine's version line is recorded verbatim, because a chart is only worth something if it says what it measured, and those lines carry git hashes and build ids. Hex sometimes spells a word: Redis 8.10.1 on the 8 core host prints build=36d555415e3ba1e6, and the `ba` in the middle of it reads as a misspelling of `by`. Nothing in this repository writes those strings and none of them can be corrected, so the hash itself is skipped rather than the file it sits in, which keeps the prose around it checked.
extend-ignore-re = ["(sha|build)=[0-9a-f]{6,}"]

[default.extend-words]
# The original spells memcached this way in its filenames and we match it.
memcache = "memcache"
# numpy's function for a half open range, named after the builtin it mirrors.
arange = "arange"

[default.extend-identifiers]
# The plural of PNG. The word splitter cuts it before the last capital, keeps PN and offers to correct that to ON, so the whole thing has to be named here rather than in the word list.
PNGs = "PNGs"

[files]
extend-exclude = ["crates/cb-core/golden/", "crates/cb-chart/assets/fonts/", "Cargo.lock"]
