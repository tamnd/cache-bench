[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive only.
# The harness ships as a binary with fonts embedded in it, and a copyleft dependency would put terms on that binary that this project is not in a position to offer.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Jost is SIL Open Font License and DejaVu Sans is under the Bitstream Vera licence.
    # Neither is a crate, so neither is in this graph, but both are in the binary and both are recorded in crates/cb-chart/assets/fonts/README.md with their licence text next to them.
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The exception is the eight crates in this workspace, which depend on each other by path with no version requirement.
# A version requirement on a path dependency has to move in lockstep with the workspace version or the build stops resolving, and it buys nothing when the crate is never resolved from a registry.
# Every crate here sets publish = false, which is what makes this allowance apply to them and to nothing else.
allow-wildcard-paths = true

deny = [
    # No async runtime.
    # The harness starts a server, waits for it, starts a load generator, waits for that, and reads two files.
    # There is nothing to overlap, and an executor in the tree is one more thing between the code and a wall clock number that has to be believable.
    { name = "tokio", reason = "the harness is blocking on purpose, see spec section 03" },
    { name = "async-std", reason = "the harness is blocking on purpose, see spec section 03" },
    { name = "smol", reason = "the harness is blocking on purpose, see spec section 03" },
    # Charts are drawn, not shelled out to.
    # The whole reason this is a port is that the original's chart layer is a Python script that cannot be tested.
    { name = "pyo3", reason = "no Python in the chart path, see spec section 07" },
    # Timing is a measured quantity here.
    # Anything that reaches for the network during a run is a source of variance nobody asked for.
    { name = "reqwest", reason = "nothing in a run talks to the network" },
    { name = "curl", reason = "nothing in a run talks to the network" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
