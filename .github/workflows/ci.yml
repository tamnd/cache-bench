name: ci

# Everything that runs on every push and every pull request.
# The budget for this file is under three minutes to a verdict, because a check slower than the time it takes to switch to something else is a check people learn to scroll past.
#
# Nothing in here needs a cache server, a load generator or a PMU, and that is on purpose.
# The parts of this project that are hard to get right are the statistics and the chart geometry, and both are pure functions over committed data, so both can be tested on a runner.
# The parts that need real hardware do not run here at all and never will, because a benchmark measured on a shared runner is not a benchmark.
# Those run on named hosts, by hand, and land with M6.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are large, slow to save and restore, and useless across the fresh checkout every job gets.
  CARGO_INCREMENTAL: 0
  # Debug info is most of what rustc emits and most of what the linker then has to work through, and no job here reads a backtrace line number.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUSTFLAGS: -D warnings

# Read only, and no job here widens it.
# A benchmark harness has no reason to hold a write token on a pull request from a fork.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Style first, so a run that is going to fail on formatting fails in under a minute rather than after the test matrix.
  style:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          # Only main writes the cache.
          # A pull request reads main's and skips the upload, which is twenty to forty seconds a job that nobody was getting anything back for.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      # A workflow file that does not parse produces a run with no jobs in it, which reports as a failure with nothing to click on and no log.
      # One unquoted colon in a run line is enough to do it.
      # Parsing them here costs a second and puts the error next to a line number.
      - name: the workflow files parse
        run: |
          python3 - <<'PY'
          import sys, yaml, pathlib
          bad = False
          for p in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  yaml.safe_load(p.read_text())
              except yaml.YAMLError as e:
                  bad = True
                  print(f"{p}: {e}")
          sys.exit(1 if bad else 0)
          PY
      # The data files that drive every run, checked here by the same command that checks them on the host.
      # A typo in one of them is otherwise found by whoever starts a sweep, and a sweep starts on a machine that is not this one and runs for days.
      # This used to be a Python approximation of the same checks, which could only look at shape. doctor reads the files with the parser the harness uses and applies the checks that matter, including whether a profile's working set fits inside its own memory limit.
      - name: doctor reads the config, the profiles and the hosts file
        run: cargo run --locked --package cache-bench -- doctor --files-only
      # The claim the whole port rests on, checked on every push rather than on the days somebody remembers to check it.
      # This is the half that needs nothing: the golden files committed here round trip byte for byte, and the two golden cells reduce to the original's own chosen files byte for byte.
      # The other half needs a checkout of the original and 20160 of its run files, which is not something CI should be downloading, so it is run by hand with --against.
      - name: verify reproduces the original's own files
        run: cargo run --locked --package cache-bench -- verify

  # Two things that must never be in the tree, checked against what git is actually tracking rather than against what .gitignore says it should be.
  # A file that was committed before the ignore rule existed stays tracked and the ignore rule has no effect on it, which is exactly how both of these get in by accident.
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: no raw run data, no host list
        run: |
          raw=$(git ls-files 'results/*/runs/*' 'results/*/logs/*')
          if [ -n "$raw" ]; then
            echo "raw measurement data is tracked, it belongs in the release tarball:" >&2
            echo "$raw" >&2
            exit 1
          fi
          if git ls-files --error-unmatch hosts.toml >/dev/null 2>&1; then
            echo "hosts.toml is tracked, and it names machines that stay private" >&2
            exit 1
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2.87.3
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked
      # nextest runs one test per process and so cannot run doctests at all.
      # They are most of the documentation for the statistics crate, so they get their own step rather than being quietly dropped.
      - run: cargo test --workspace --locked --doc

  # The claim that a chart is a function of its data and nothing else.
  # Three operating systems draw the same 154 charts from the same committed series and every PNG has to hash to what is in the manifest.
  # A chart that comes out different on Windows is a chart whose numbers cannot be compared across machines, which would quietly undo the thing this repository exists to do.
  # The charts drawn here carry no provenance stamp, because a hostname in the picture would make the hash depend on which runner drew it.
  determinism:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: every chart hashes to what is committed
        run: cargo run --locked --release --package cache-bench -- chart --golden --check crates/cb-core/golden/charts.sha256

  # Every generated document is the one the generator would write.
  # The two chart indexes and the results README are output, not source, and the failure this catches is somebody fixing a typo in a published README and having the next sweep silently throw the fix away.
  # A generated file that is edited by hand is a file that is now lying about the data next to it, so it fails the build instead.
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Generating twice into two directories and diffing them is what proves the generator is a function of its inputs.
      # A document that comes out different on a second run cannot be checked at all, so this has to pass before the check below means anything.
      - name: generating twice produces the same bytes
        run: |
          cargo run --locked --release --package cache-bench -- docs --golden --out "$RUNNER_TEMP/once"
          cargo run --locked --release --package cache-bench -- docs --golden --out "$RUNNER_TEMP/twice"
          diff -r "$RUNNER_TEMP/once" "$RUNNER_TEMP/twice"
      # Nothing is published yet, so this loop is empty until the first results directory lands, and then it guards every one of them.
      - name: no published document was edited by hand
        run: |
          shopt -s nullglob
          found=0
          for dir in results/*/; do
            found=1
            echo "checking $dir"
            cargo run --locked --release --package cache-bench -- docs --dir "$dir" --check
          done
          if [ "$found" = 0 ]; then
            echo "no results directories yet, nothing to check"
          fi

  # The floor stays green too.
  # It is the same floor as tamnd/yo, so the two trees agree on what a supported compiler is.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # rust-toolchain.toml pins the working toolchain and has to be out of the way for this job to test what it says it tests.
      - run: rm rust-toolchain.toml
      - run: cargo test --workspace --locked

  # Documentation is part of the interface.
  # A broken intra doc link is a broken link in the published reference, so it fails the build.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: rm rust-toolchain.toml
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings --cfg docsrs

  # Every crate is publishable, checked on every push rather than on the day a tag is cut.
  # A package only carries what is inside its own directory, so an include_str! or an include_bytes! that reaches up out of the crate builds here and fails for everybody who installs it. cargo package builds each crate from its own tarball, which is the only way to find that before the version is on crates.io and cannot be replaced.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo package --workspace --locked

  # Licences, advisories and duplicate versions.
  # The licence half is the half that matters here: this repository ships fonts and will ship result data, and both have terms that are easy to get wrong by accident.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check all

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: crate-ci/typos@v1.50.1
